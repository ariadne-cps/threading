name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CONF: ${{ github.workspace }}/ss/bui/cmake/sccache.toml

jobs:
  build-test:
    name: ${{ matrix.config.name }} [${{ matrix.build_type }}]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        config:
          - { name: "Ubuntu 24.04 x86 Clang 16", os: ubuntu-24.04, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 arm Clang 16", os: ubuntu-24.04-arm, cxx: "clang++-16", pkg: "clang-16" }
          - { name: "Ubuntu 24.04 x86 GCC 13", os: ubuntu-24.04, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }
          - { name: "Ubuntu 24.04 arm GCC 13", os: ubuntu-24.04-arm, cxx: "g++-13", pkg: "g++-13", libstdcxx_debug: true }

    steps:
      - uses: actions/checkout@v7

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: "v0.18.0"

      - name: Get Linux concurrency
        if: runner.os == 'Linux'
        run: echo "NPROC=$(nproc)" >> "$GITHUB_ENV"

      - name: Set up Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ${{ matrix.config.pkg }}

      - name: Initialize optional sccache before compilation
        run: |
          git submodule update --init -- ss/bui
          cmake -P ss/bui/cmake/InitializeSccache.cmake

      - name: Configure CMake
        env:
          CXXFLAGS: ${{ matrix.build_type == 'Debug' && matrix.config.libstdcxx_debug && '-D_GLIBCXX_DEBUG' || '' }}
        run: |
          cmake -S . -B "${{ runner.workspace }}/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_LAUNCHER" \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build Release library
        if: matrix.build_type == 'Release'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target ariadne-threading

      - name: Build and smoke-test benchmarking integration
        if: matrix.build_type == 'Release'
        run: |
          cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target benchmark_thread_pool benchmark_use_cases
          pool="${{ runner.workspace }}/build/benchmarks/benchmark_thread_pool"
          cases="${{ runner.workspace }}/build/benchmarks/benchmark_use_cases"
          "$pool" --mode flat --concurrency 0 --tasks 16 --work 2 --samples 3 --warmups 1 --summary median,min,count
          "$pool" --mode recursive --concurrency 2 --depth 4 --tasks 8 --work 2 --samples 3 --warmups 1
          "$pool" --mode micro --concurrency 0 --tasks 8 --work 2 --samples 3
          "$pool" --mode breakdown --concurrency 0 --tasks 8 --work 2 --samples 3
          "$pool" --mode handle-compare --concurrency 0 --tasks 8 --work 2 --samples 3
          "$pool" --mode ownership --concurrency 2 --tasks 8 --work 2 --samples 3
          "$cases" --mode all --workers 2 --cases 8 --work 2 --batch-grain 2 --samples 3 --warmups 1 --summary median,min,count
          "$pool" --help
          "$cases" --help

      - name: Install Release library
        if: matrix.build_type == 'Release'
        run: cmake --install "${{ runner.workspace }}/build" --prefix "${{ runner.workspace }}/install"

      - name: Check installed umbrella header
        if: matrix.build_type == 'Release'
        run: |
          prefix="${{ runner.workspace }}/install/include/ariadne-threading"
          test -f "$prefix/ariadne-threading.hpp"
          printf '#include "ariadne-threading.hpp"\nint main() { return 0; }\n' |
            "${{ matrix.config.cxx }}" -std=c++20 -x c++ -fsyntax-only -I "$prefix" -

      - name: Build Debug tests
        if: matrix.build_type == 'Debug'
        run: cmake --build "${{ runner.workspace }}/build" --parallel "$NPROC" --target tests

      - name: Run Debug tests
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir "${{ runner.workspace }}/build" -j "$NPROC" --output-on-failure
